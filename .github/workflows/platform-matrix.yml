          # backslash path whose separators bash would eat as escapes when the
          # glob below expands. The step starts in the workspace root either way.
          for dir in "$PWD"/*/; do
            name=$(basename "$dir")
            [ "$name" = version ] && continue
            [ -d "$dir/.git" ] || continue
            git -C "$dir" ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1 || continue
            git -C "$dir" fetch -q --depth 1 origin "$branch"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "aligned $name to $branch"
          done
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found").
        shell: bash
        run: alr settings --global --set solver.timeout 600
      - name: Download platform evidence
        uses: actions/download-artifact@v8
        with:
          path: version/.release/platform-ci-evidence
      - name: Build version
        working-directory: version
        run: alr --non-interactive build
      - name: Build tool binaries
        working-directory: version
        run: alr exec -- gprbuild -P tools/tools.gpr
      - name: Verify POSIX and Windows evidence match the source tree
        working-directory: version
        run: tools/bin/check_platform_ci_evidence .release/platform-ci-evidence
