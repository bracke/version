        # version and versionlib change together, so a feature branch here must
        # build against the same branch there -- the siblings are cloned at
        # their default branch, which for versionlib is several hundred commits
        # behind and cannot satisfy this CLI.
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
