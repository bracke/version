          # backslash path whose separators bash would eat as escapes when the
          # glob below expands. The step starts in the workspace root either way.
          for dir in "$PWD"/*/; do
            name=$(basename "$dir")
            [ "$name" = version ] && continue
            [ -d "$dir/.git" ] || continue
            git -C "$dir" ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1 || continue
            git -C "$dir" fetch -q --depth 1 origin "$branch"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "aligned $name to $branch"
          done
      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found").
        shell: bash
        run: alr settings --global --set solver.timeout 600
      - name: Build version
        working-directory: version
        shell: bash
        run: alr --non-interactive build
      - name: Build tool binaries
        working-directory: version
        shell: bash
        run: alr exec -- gprbuild -P tools/tools.gpr
      - name: Generate tests-crate config
        working-directory: version/tests
        shell: bash
        run: alr --non-interactive build
      - name: Run Windows platform gate
        working-directory: version
        shell: bash
        # A suite that blocks (an editor, a prompt, a spawn that never
        # returns) otherwise sits here until the six-hour job timeout; fail
        # while the log is still worth reading.
        timeout-minutes: 75
        env:
          VERSION_PLATFORM_CI_EVIDENCE_DIR: .release/platform-ci-evidence
        run: ./tools/bin/check_platform_ci_matrix.exe windows
      - name: Upload Windows platform evidence
        uses: actions/upload-artifact@v7
        with:
          name: platform-windows-evidence
          path: version/.release/platform-ci-evidence/platform-windows.txt

  verify-platform-evidence:
    name: Verify platform evidence
    runs-on: ubuntu-latest
    needs: [posix, windows]
    steps:
      - uses: actions/checkout@v7
        with: { path: version }
      - name: Check out sibling crates (transitive pin closure)
        # Derived from the alire.toml pins themselves: a hand-listed set goes
        # stale the moment the graph gains a crate (it last missed ssllib and
        # truststores, and the build died on the pin rather than the code).
